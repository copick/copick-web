name: Build and Publish Docker Images

on:
  workflow_call:
    inputs:
      ref:
        description: Immutable commit to build
        required: true
        type: string
      version:
        description: Exact application version
        required: true
        type: string
      prerelease:
        description: Publish the moving alpha tag instead of latest
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to build
        required: true
        type: string
      version:
        description: Exact application version
        required: true
        type: string
      prerelease:
        description: Publish as an alpha without moving latest
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve immutable commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-server
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=sha-${{ steps.commit.outputs.sha }}
            type=raw,value=alpha,enable=${{ inputs.prerelease }}
            type=raw,value=latest,enable=${{ !inputs.prerelease }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve immutable commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-client
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=sha-${{ steps.commit.outputs.sha }}
            type=raw,value=alpha,enable=${{ inputs.prerelease }}
            type=raw,value=latest,enable=${{ !inputs.prerelease }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
