name: Python Linting

on:
  pull_request:
    paths:
      - 'server/**'
      - '.pre-commit-config.yaml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.pre-commit-config.yaml'

jobs:
  pre_commit_checks:
    name: pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install action-validator with asdf
        uses: asdf-vm/actions/install@v4
        with:
          tool_versions: |
            action-validator 0.6.0

      - name: check linting
        uses: pre-commit/action@v3.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Dependabot and release-please keep server/uv.lock current; this catches a hand edit of pyproject.toml.
      - name: Check lockfile
        working-directory: server
        run: uv lock --check
