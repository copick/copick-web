name: Python Linting

on:
  pull_request:
    branches: [main, v2.0]
    paths:
      - 'server/**'
      - '.pre-commit-config.yaml'
      - '.github/workflows/py-lint.yml'
  push:
    branches: [main, v2.0]
    paths:
      - 'server/**'
      - '.pre-commit-config.yaml'
      - '.github/workflows/py-lint.yml'

jobs:
  pre_commit_checks:
    name: pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install action-validator with asdf
        uses: asdf-vm/actions/install@v4
        with:
          tool_versions: |
            action-validator 0.6.0

      - name: check linting
        uses: pre-commit/action@v3.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # Dependabot and release-please keep server/uv.lock current; this catches a hand edit of pyproject.toml.
      - name: Check lockfile
        working-directory: server
        run: uv lock --check
