name: Create Release PRs

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to release
        required: true
        default: main
        type: choice
        options:
          - main
          - v2.0
  push:
    branches:
      - main
      - v2.0

env:
  RELEASE_TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'workflow_dispatch' || github.event.created == false
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}
      cancel-in-progress: true

    runs-on: ubuntu-latest
    steps:
      - name: Create or update the linked release PR
        uses: googleapis/release-please-action@v5
        id: release
        with:
          manifest-file: ".release-please.manifest.json"
          config-file: ${{ env.RELEASE_TARGET_BRANCH == 'v2.0' && 'release-please.prerelease.config.json' || 'release-please.config.json' }}
          target-branch: ${{ env.RELEASE_TARGET_BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      server_release_created: ${{ steps.release.outputs['server--release_created'] }}
      server_sha: ${{ steps.release.outputs['server--sha'] }}
      server_version: ${{ steps.release.outputs['server--version'] }}
      client_release_created: ${{ steps.release.outputs['client--release_created'] }}
      client_sha: ${{ steps.release.outputs['client--sha'] }}
      client_version: ${{ steps.release.outputs['client--version'] }}

  validate-linked-release:
    name: Validate linked release
    needs: release-please
    if: needs.release-please.outputs.server_release_created == 'true' || needs.release-please.outputs.client_release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require the server and client to release together
        env:
          SERVER_RELEASE_CREATED: ${{ needs.release-please.outputs.server_release_created }}
          CLIENT_RELEASE_CREATED: ${{ needs.release-please.outputs.client_release_created }}
          SERVER_SHA: ${{ needs.release-please.outputs.server_sha }}
          CLIENT_SHA: ${{ needs.release-please.outputs.client_sha }}
          SERVER_VERSION: ${{ needs.release-please.outputs.server_version }}
          CLIENT_VERSION: ${{ needs.release-please.outputs.client_version }}
        run: |
          test "$SERVER_RELEASE_CREATED" = true
          test "$CLIENT_RELEASE_CREATED" = true
          test "$SERVER_SHA" = "$CLIENT_SHA"
          test "$SERVER_VERSION" = "$CLIENT_VERSION"

  publish-images:
    name: Publish linked application images
    needs: [release-please, validate-linked-release]
    if: needs.validate-linked-release.result == 'success'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      ref: ${{ needs.release-please.outputs.server_sha }}
      version: ${{ needs.release-please.outputs.server_version }}
      prerelease: ${{ contains(needs.release-please.outputs.server_version, '-') }}

  build-release:
    name: Build and inspect release artifacts
    runs-on: ubuntu-latest
    needs: [release-please, validate-linked-release]
    if: needs.validate-linked-release.result == 'success'
    permissions:
      contents: read
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.server_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The wheel ships the built client (server/src/copick_web/static), so `pip install copick-web` serves the UI.
      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build:server

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.4"
          python-version: "3.12"

      - name: Verify Python version
        run: >
          uv run --no-project python -c
          "import sys; v = sys.version_info;
          assert (v.major, v.minor) == (3, 12), sys.version;
          assert v.releaselevel == 'final', sys.version;
          print(sys.version)"

      - name: Build distributions
        working-directory: server
        run: uv build

      - name: Check the wheel ships the client
        working-directory: server
        run: unzip -l dist/*.whl | grep -q 'copick_web/static/index.html' || { echo "wheel is missing the client build"; exit 1; }

      - name: Check the built version is the release's
        working-directory: server
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.server_version }}
        run: >
          uv run --no-project --with packaging python -c
          "import glob, os, sys; from packaging.version import Version;
          want = Version(os.environ['RELEASE_VERSION']);
          got = Version(os.path.basename(glob.glob('dist/*.whl')[0]).split('-')[1]);
          print(f'release {want}, built {got}');
          sys.exit(0 if got == want else f'Built {got}, but the release is {want}: server/pyproject.toml was not bumped.')"

      - name: Preserve validated artifacts
        uses: actions/upload-artifact@v7
        with:
          name: copick-web-${{ needs.release-please.outputs.server_sha }}
          path: server/dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi-package:
    name: Publish validated Python package to PyPI
    runs-on: ubuntu-latest
    needs: [release-please, build-release]
    if: needs.build-release.result == 'success'
    environment:
      name: pypi
      url: https://pypi.org/p/copick-web
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@v7
        with:
          name: copick-web-${{ needs.release-please.outputs.server_sha }}
          path: dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
