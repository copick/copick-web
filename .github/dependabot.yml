# GitHub reads this file from the default branch only, so every entry appears twice: once for main
# and once with target-branch v2.0 (v2.0's own copy takes effect when it becomes the default).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/server"
    target-branch: "main"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: fix
      prefix-development: chore
  - package-ecosystem: "uv"
    directory: "/server"
    target-branch: "v2.0"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: fix
      prefix-development: chore
  - package-ecosystem: "npm"
    directory: "/client"
    target-branch: "main"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: fix
      prefix-development: chore
  - package-ecosystem: "npm"
    directory: "/client"
    target-branch: "v2.0"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: fix
      prefix-development: chore
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: fix
      prefix-development: chore
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "v2.0"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: fix
      prefix-development: chore
